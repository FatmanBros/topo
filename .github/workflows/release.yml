name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            npm-package: topo-ui-linux-x64
            binary: topo
          - os: macos-latest
            target: aarch64-apple-darwin
            npm-package: topo-ui-darwin-arm64
            binary: topo
          - os: macos-latest
            target: x86_64-apple-darwin
            npm-package: topo-ui-darwin-x64
            binary: topo
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            npm-package: topo-ui-win32-x64
            binary: topo.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Copy binary to npm package
        shell: bash
        run: |
          mkdir -p npm/${{ matrix.npm-package }}/bin
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} npm/${{ matrix.npm-package }}/bin/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm-package }}
          path: npm/${{ matrix.npm-package }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: npm-packages

      - name: Prepare packages
        run: |
          # Copy platform packages (merge artifacts into existing npm package dirs)
          for pkg in topo-ui-linux-x64 topo-ui-darwin-arm64 topo-ui-darwin-x64 topo-ui-win32-x64; do
            # Ensure bin directory exists
            mkdir -p npm/$pkg/bin
            # Copy bin directory from artifacts to npm package
            cp -r npm-packages/$pkg/bin/* npm/$pkg/bin/
            chmod +x npm/$pkg/bin/* 2>/dev/null || true
            echo "Contents of npm/$pkg:"
            ls -la npm/$pkg/
            ls -la npm/$pkg/bin/
          done

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update package versions
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          # Update main package version
          cd npm/topo-ui
          npm version $VERSION --no-git-tag-version --allow-same-version
          # Update optionalDependencies versions
          sed -i "s/\"0.1.0\"/\"$VERSION\"/g" package.json
          cd ../..

          # Update platform package versions
          for pkg in topo-ui-linux-x64 topo-ui-darwin-arm64 topo-ui-darwin-x64 topo-ui-win32-x64; do
            cd npm/$pkg
            npm version $VERSION --no-git-tag-version --allow-same-version
            cd ../..
          done

      - name: Publish platform packages
        run: |
          for pkg in topo-ui-linux-x64 topo-ui-darwin-arm64 topo-ui-darwin-x64 topo-ui-win32-x64; do
            cd npm/$pkg
            npm publish --access public --provenance
            cd ../..
          done

      - name: Publish main package
        run: |
          cd npm/topo-ui
          npm publish --access public --provenance

      - name: Publish components package
        run: |
          cd packages/components
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version
          npm publish --access public --provenance
