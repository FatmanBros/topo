[package]
name = "topo"
version = "0.1.0"
edition = "2021"
description = "A UI framework that eliminates nesting hell"
license = "MIT"

[[bin]]
name = "topo"
path = "src/main.rs"

[[bin]]
name = "topo-lsp"
path = "src/lsp/main.rs"

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File watching (for dev server)
notify = "6.1"

# HTTP server (for start/dev commands)
tiny_http = "0.12"

# WebSocket (for hot reload)
tungstenite = "0.21"

# File globbing (for test discovery)
glob = "0.3"

# LSP
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
ropey = "1.6"
dashmap = "5.5"
once_cell = "1.19"
regex = "1.10"
walkdir = "2.4"
pathdiff = "0.2"

[dev-dependencies]
pretty_assertions = "1.4"
