[package]
name = "topo"
version = "0.1.0"
edition = "2021"
description = "A UI framework that eliminates nesting hell"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File watching (for dev server)
notify = "6.1"

# HTTP client generation
# (will be used for runtime)

[dev-dependencies]
pretty_assertions = "1.4"
